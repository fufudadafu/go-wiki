<script>
'use strict';
const DATA=JSON.parse(document.getElementById('content-data').textContent);
__GO_MODEL__
const F=fixtures();
const SLIDES=[
 {title:'圍棋入門',chapter:'第一盤棋之前',page:'board',refs:['S01','S04'],kind:'cover'},
 {title:'棋子落在交叉點',chapter:'認識棋盤',page:'board',refs:['S01','S04','S05'],kind:'board'},
 {title:'輪到你時的選擇',chapter:'基本落子',page:'board',refs:['S01','S05'],kind:'turn'},
 {title:'棋子的氣',chapter:'氣與連接',page:'liberties',refs:['S02','S04','S05'],kind:'liberty'},
 {title:'一塊棋，共用氣',chapter:'氣與連接',page:'liberties',refs:['S02','S04'],kind:'chain'},
 {title:'打吃與提子',chapter:'提走對方的棋',page:'capture',refs:['S02','S04','S05'],kind:'capture'},
 {title:'落子後，還有氣嗎？',chapter:'合法落子',page:'legal',refs:['S03','S05'],kind:'legal'},
 {title:'劫：不能立即提回',chapter:'合法落子',page:'ko',refs:['S01','S04','S05'],kind:'ko'},
 {title:'兩個真眼的活棋',chapter:'簡單死活',page:'eyes',refs:['S04'],kind:'eyes'},
 {title:'停一手與終局',chapter:'準備計分',page:'ending',refs:['S04','S05'],kind:'end'},
 {title:'數子法：活子加空點',chapter:'勝負計算',page:'scoring',refs:['S05'],kind:'score'},
 {title:'這塊黑棋有幾口氣？',chapter:'練習一／數氣',page:'liberties',refs:['S02','S04','S05'],kind:'q1'},
 {title:'黑棋下哪裡能提子？',chapter:'練習二／提子',page:'capture',refs:['S02','S04','S05'],kind:'q2'},
 {title:'黑棋可以下在 A 點嗎？',chapter:'練習三／合法落子',page:'legal',refs:['S03','S05'],kind:'q3'},
 {title:'你的第一盤 9 路棋',chapter:'重點整理',page:'board',refs:['S01','S04','S05'],kind:'recap'},
 {title:'繼續閱讀與來源',chapter:'課程資料',page:'index',refs:['S01','S02','S03','S04','S05'],kind:'sources'}
];
let current=0,view='lesson',libShown=false,captured=false,legalExample=false,koAfter=false,scoreShown=false;
const answers={},svgCount={n:0};
function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function boardSvg(board,opts={}){
 const id='stone-'+(++svgCount.n),pad=40,step=55;
 let out='<svg class="board-svg" viewBox="0 0 520 520" role="img" aria-label="'+e(opts.title||'自編九路盤教學示意')+'"><title>'+e(opts.title||'九路盤教學示意')+'</title><defs><radialGradient id="'+id+'-b" cx="32%" cy="25%"><stop offset="0" stop-color="#59615a"/><stop offset=".45" stop-color="#252e29"/><stop offset="1" stop-color="#101713"/></radialGradient><radialGradient id="'+id+'-w" cx="32%" cy="25%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9dfd8"/></radialGradient></defs><rect x="3" y="3" width="514" height="514" rx="12" fill="#e1bb7c" stroke="#caa367"/>';
 for(let i=0;i<9;i++){const p=pad+i*step;out+='<path d="M40 '+p+' H480 M'+p+' 40 V480" stroke="#755936" stroke-width="1.2"/>';}
 for(const [x,y] of [[2,2],[6,2],[4,4],[2,6],[6,6]])out+='<circle cx="'+(pad+x*step)+'" cy="'+(pad+y*step)+'" r="3" fill="#755936"/>';
 if(opts.highlights)for(const item of opts.highlights){
  const [x,y,label]=item;
  out+='<circle cx="'+(pad+x*step)+'" cy="'+(pad+y*step)+'" r="15" fill="#187054" stroke="#fff" stroke-width="2"/>';
  if(label)out+='<text x="'+(pad+x*step)+'" y="'+(pad+y*step+6)+'" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="700" fill="#fff">'+e(label)+'</text>';
 }
 for(let y=0;y<9;y++)for(let x=0;x<9;x++)if(board[y][x]){
  const p=board[y][x]===1?'b':'w';
  out+='<circle cx="'+(pad+x*step+1)+'" cy="'+(pad+y*step+3)+'" r="23" fill="#5a4529" opacity=".2"/><circle cx="'+(pad+x*step)+'" cy="'+(pad+y*step)+'" r="23" fill="url(#'+id+'-'+p+')" stroke="'+(p==='b'?'#17221c':'#abb4ab')+'" stroke-width="1"/>';
 }
 if(opts.marks)for(const [x,y,label] of opts.marks)out+='<circle cx="'+(pad+x*step)+'" cy="'+(pad+y*step)+'" r="17" fill="#b54732"/><text x="'+(pad+x*step)+'" y="'+(pad+y*step+6)+'" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="700" fill="#fff">'+e(label)+'</text>';
 out+='</svg>';return out;
}
function boardFigure(board,opts={},buttons=''){
 return '<div class="board-wrap">'+boardSvg(board,opts)+'<p class="board-caption">'+e(opts.caption||'自編局部教學示意，非職業棋譜')+'</p>'+(buttons?'<div class="controls">'+buttons+'</div>':'')+'</div>';
}
function action(label,name,primary=false){return '<button '+(primary?'class="primary" ':'')+'data-action="'+name+'">'+label+'</button>';}
function sourceList(){return '<ul class="source-list">'+DATA.sources.map(s=>'<li><a href="'+s.url+'" target="_blank" rel="noopener noreferrer">'+s.id+'　'+e(s.label)+'</a><small>'+e(s.org)+' · '+e(s.language)+'</small></li>').join('')+'</ul>';}
function quiz(number,options,correct,explanation){
 const picked=answers[number];
 let out='<div class="options" role="group" aria-label="練習選項">';
 options.forEach((label,i)=>{out+='<button data-answer="'+number+':'+i+'"'+(picked===i?' class="'+(i===correct?'chosen':'wrong')+'"':'')+' aria-pressed="'+(picked===i)+'">'+e(label)+'</button>';});
 out+='</div>';
 if(picked!==undefined)out+='<div class="feedback '+(picked===correct?'':'incorrect')+'" role="status">'+(picked===correct?'答對了。':'再想一想。')+e(picked===correct?explanation:explanation+' 可以重新選擇。')+'</div>';
 return out;
}
function renderLesson(){
 const s=SLIDES[current];let text='',visual='';
 const title='<span class="eyebrow">GO / BEGINNER</span><h1'+(s.kind==='cover'?' class="hero-title"':'')+'>'+s.title+'</h1>';
 if(s.kind==='cover'){
  text='<p class="lead">一張棋盤，黑白兩色。<br>從「氣」開始，讀懂每一步。</p><p class="small">完全新手適用 · 9 路盤 · 約 15–20 分鐘</p><p class="note">你會學到數氣、提子與基本合法落子，再完成三題盤面練習。</p>';
  visual=boardFigure(position([[2,2],[3,2],[2,3],[4,4],[5,4],[4,5]],[[6,6],[5,6],[6,5],[4,2],[5,2]]),{caption:'先看局部的氣，再認識整盤的空間。'});
 }else if(s.kind==='board'){
  text='<p>棋子放在線與線的<strong>交叉點</strong>，邊與角的交叉點也能下。</p><p>這裡使用 9 路盤，共有 <strong>81 個交叉點</strong>。一般大棋盤是 19 路。</p><p class="note">棋子落下後留在原處，被提走時才移出棋盤。</p>';
  visual=boardFigure(position([[2,2],[0,0]],[[6,6],[8,8]]),{highlights:[[4,4,'']],caption:'綠點標示可辨識的交叉點位置。'});
 }else if(s.kind==='turn'){
  text='<p>不讓子的對局通常由黑棋先下，接著黑白輪流。</p><ul><li>在一個合法空點落下一子。</li><li>或者選擇<strong>停一手</strong>。</li></ul><p class="note">一個交叉點只能放一顆棋子。能否落子，還要檢查氣與劫。</p>';
  visual=boardFigure(position([[4,4]],[[5,4]]),{highlights:[[4,5,'']],caption:'輪到黑棋，可以考慮綠點等合法空點。'});
 }else if(s.kind==='liberty'){
  text='<p>棋子上下左右相鄰的空點，叫作<strong>氣</strong>。</p><p>中央的這顆黑子有 <strong>4 口氣</strong>。斜角不直接算氣。</p><p class="note">在空盤上，邊上的單子最多有 3 口氣，角上最多有 2 口氣。</p>';
  visual=boardFigure(position([[4,4]]),{highlights:libShown?[[3,4,''],[5,4,''],[4,3,''],[4,5,'']]:[],caption:libShown?'四個綠點就是這顆黑子的四口氣。':'先自己數，再按按鈕核對。'},action(libShown?'隱藏氣':'顯示氣','liberty'));
 }else if(s.kind==='chain'){
  text='<p>上下左右相連的同色棋子，形成<strong>同一塊棋</strong>。</p><p>數整塊棋周圍的空點，<strong>重複的空點只算一次</strong>。</p><p class="note">斜著靠近的兩顆棋子，還不算直接相連。</p>';
  const b=position([[3,3],[4,3],[3,4]]);const high=[...group(b,3,3).liberties].map(k=>k.split(',').map(Number));
  visual=boardFigure(b,{highlights:high,caption:'三顆相連黑子，共有 7 口不同的氣。'});
 }else if(s.kind==='capture'){
  text='<p>中央白子只剩 A 點這一口氣，稱為<strong>打吃</strong>。</p><p>黑棋下在 A 點後，白子沒有氣，便被<strong>提走</strong>。</p><p class="note">如果整塊棋都沒有氣，要把整塊棋一起提走。</p>';
  const b=captured?move(F.capture,1,4,5).board:F.capture;
  visual=boardFigure(b,{marks:captured?[]:[[4,5,'A']],caption:captured?'黑下 A 後，中央白子已移除。':'輪黑，紅色 A 是白子的最後一口氣。'},action(captured?'回到提子前':'播放提子','capture',true));
 }else if(s.kind==='legal'){
  text='<p>落子時，要先處理對方因此失去所有氣的棋，再檢查自己的氣。</p><p><strong>不能只看落點是否被包圍。</strong></p><p class="note">'+(legalExample?'這裡黑下 A 能提掉上方白子，取得一口氣，因此合法。':'這裡黑下 A 無法提走白子，自己的棋又沒有氣，因此不合法。')+'</p>';
  visual=boardFigure(legalExample?F.exception:F.suicide,{marks:[[4,4,'A']],caption:legalExample?'合法例：提子後，自己的棋有氣。':'禁入例：提不到對手，自己的棋也無氣。'},action(legalExample?'查看禁入例':'查看提子例外','legal'));
 }else if(s.kind==='ko'){
  text='<p>黑下 A，提走中央白子後，白棋若立刻下回原位，也能提掉剛下的黑子。</p><p>盤面將回到原樣。這種<strong>立即提回</strong>受到劫的限制。</p><p class="note">這裡只示範簡單劫。其他全局重複判定依所採規則處理。</p>';
  visual=boardFigure(koAfter?move(F.ko,1,4,5).board:F.ko,{marks:koAfter?[[4,4,'禁']]:[[4,5,'A']],caption:koAfter?'白不能立刻在「禁」點提回。':'輪黑，黑在 A 提掉中央白子。'},action(koAfter?'回到提劫前':'查看提劫後','ko',true));
 }else if(s.kind==='eyes'){
  text='<p>這一整塊相連黑棋，保留了兩個分開的<strong>真眼</strong>。</p><p>白棋無法用合法落子同時填掉兩眼，因此黑棋可以存活。</p><p class="note">沒有兩眼的棋也可能因雙活而存活。假眼與複雜死活留到下一階段。</p>';
  visual=boardFigure(F.eyes,{highlights:[[3,4,'眼'],[5,4,'眼']],caption:'同一塊黑棋，兩個互相分開的真眼。'});
 }else if(s.kind==='end'){
  text='<p>雙方認為沒有需要繼續下的地方，可以停一手。</p><p>連續停一手後，先<strong>確認死活與死子</strong>，再進行計分。</p><p class="note">若對死活有爭議，依採用規則續弈或處理，不能任意刪除對方的棋。</p>';
  visual=boardFigure(F.scoring,{caption:'下一頁使用雙方已確認無死子的自編終局。'});
 }else if(s.kind==='score'){
  text='<p class="small">本題設定：9 路、不讓子、白貼 6.5 分。貼目為教學自訂值。</p><div class="formula">黑：43 活子 + 2 空點 = <b>45</b></div><div class="formula">白：34 活子 + 2 空點 + 6.5 = <b>42.5</b></div><p><strong>黑勝 2.5 分。</strong></p><p class="note">面積計分採活子加空點，提走的棋子不另外加分。本題無中立點與死子。</p>';
  visual=boardFigure(F.scoring,{highlights:scoreShown?[[1,2,'黑'],[1,6,'黑'],[7,2,'白'],[7,6,'白']]:[],caption:scoreShown?'四個標記點，分別是黑白所圍的兩個空點。':'盤上 77 顆活子，另有 4 個所圍空點。'},action(scoreShown?'隱藏空點標記':'標示所圍空點','score'));
 }else if(s.kind==='q1'){
  text='<p>只數相連的兩顆黑子，共用的空點不要重複算。</p>'+quiz(1,['2 口氣','3 口氣','4 口氣','5 口氣'],1,'兩顆黑子相鄰的不同空點共有三個，斜角不算。');
  const hi=answers[1]===1?[...group(F.chain,3,4).liberties].map(k=>k.split(',').map(Number)):[];
  visual=boardFigure(F.chain,{highlights:hi,caption:'請數中央兩顆相連黑子的氣。'});
 }else if(s.kind==='q2'){
  text='<p>輪黑。哪個標記點能提走中央白子？</p>'+quiz(2,['A 點','B 點','C 點','D 點'],0,'A 是中央白子的最後一口氣。黑下 A 後，白子被提走。');
  visual=boardFigure(answers[2]===0?move(F.capture,1,4,5).board:F.capture,{marks:answers[2]===0?[]:[[4,5,'A'],[3,5,'B'],[5,5,'C'],[4,6,'D']],caption:answers[2]===0?'正確落子後的盤面。':'找出白子上下左右唯一的空點。'});
 }else if(s.kind==='q3'){
  text='<p>A 點四周都是白子。黑棋下在 A 點合法嗎？</p>'+quiz(3,['合法，會先提掉上方白子並取得氣。','不合法，四周都是白子就一定不能下。'],0,'上方白子也只剩 A 這口氣。黑下 A 先提走它，再取得上方空點的一口氣。');
  visual=boardFigure(answers[3]===0?move(F.exception,1,4,4).board:F.exception,{marks:answers[3]===0?[]:[[4,4,'A']],highlights:answers[3]===0?[[4,3,'']]:[],caption:answers[3]===0?'提掉上方白子後，綠點成為黑子的氣。':'請先檢查上方白子的氣。'});
 }else if(s.kind==='recap'){
  text='<p>開始前先約定棋盤、規則與貼目。</p><ul><li>棋子下在交叉點，黑白輪流。</li><li>留意整塊棋的氣，辨認打吃與提子。</li><li>合法落子要處理提子與劫。</li><li>終局確認死活，再用約定方式計分。</li></ul><p class="note">回到「知識 Wiki」可查找每個概念與原始來源。</p>';
  visual=boardFigure(position([[2,2],[3,2],[2,3],[4,4]],[[6,6],[5,6],[6,5],[4,6]]),{caption:'用小棋盤練習，每次先把氣看清楚。'});
 }else{
  text='<p>這份課程依五篇來源整理成 Wiki，再從概念頁編排教學。</p><p>外文術語已統一為繁體中文。原文、版本與計分差異保留在來源卡。</p><p>'+action('閱讀知識 Wiki','open-wiki',true)+' '+action('查看流程與反思','open-process')+'</p><p class="small">S05 是 1991 版，本文只取面積計分定義。所有棋盤均為自編教學示意。</p>';
  visual='<div class="lesson-sources">'+sourceList()+'</div>';
 }
 document.getElementById('slide-content').innerHTML='<div class="slide-grid"><div class="copy">'+title+text+'</div><div class="visual">'+visual+'</div></div>';
 document.getElementById('chapter').textContent=s.chapter;
 document.getElementById('pager').textContent=String(current+1).padStart(2,'0')+' / '+SLIDES.length+'　頁';
 document.getElementById('previous').disabled=current===0;document.getElementById('next').disabled=current===SLIDES.length-1;
 document.getElementById('progress-bar').style.width=((current+1)/SLIDES.length*100)+'%';
 document.getElementById('slidejump').value=current;
 document.getElementById('slide-sources').innerHTML='Wiki：<a href="#wiki/'+s.page+'" data-route="wiki/'+s.page+'">'+e(s.page==='index'?'目錄':DATA.pages.find(p=>p.slug===s.page).title)+'</a>　依據：'+s.refs.map(id=>{const src=DATA.sources.find(x=>x.id===id);return '<a href="'+src.url+'" target="_blank" rel="noopener noreferrer">'+id+'</a>';}).join(' ')+'<span>圖例與數值為本課自編。</span>';
}
function renderWiki(key){
 const page=DATA.wiki.find(p=>p.key===key)||DATA.wiki.find(p=>p.key==='index');
 const menu=document.getElementById('wiki-menu');menu.innerHTML='';
 for(const kind of ['維護','概念','來源']){
  menu.innerHTML+='<h2>'+kind+'</h2>'+DATA.wiki.filter(p=>p.kind===kind).map(p=>'<a href="#wiki/'+p.key+'" data-route="wiki/'+p.key+'" data-search="'+e(p.title+' '+p.search)+'"'+(p.key===page.key?' aria-current="page"':'')+'>'+e(p.title)+'</a>').join('');
 }
 document.getElementById('wiki-article').innerHTML='<div class="wiki-path">'+e(page.path)+'</div>'+page.html;
 filterWiki();
}
function filterWiki(){
 const q=document.getElementById('wiki-search').value.toLowerCase().trim();let count=0;
 document.querySelectorAll('#wiki-menu a').forEach(a=>{const ok=a.dataset.search.toLowerCase().includes(q);a.hidden=!ok;if(ok)count++;});
 document.getElementById('empty-search').hidden=count>0;
}
function flowSvg(){
 const nodes=[['取得五篇來源',65],['檢查正文、規則版本',165],['逐篇 ingest、更新來源卡',265],['整合 Wiki、檢查一致性',365],['查詢 Wiki、編排教學',465],['產生 HTML 簡報',565],['盤面、程式與連結檢查',665],['記錄結果與反思',765]];
 let out='<svg class="flow-svg" viewBox="0 0 650 830" role="img" aria-label="來源規則檢查、五次 ingest、Wiki 整合、簡報生成與檢查回圈"><defs><marker id="flow-end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#17674f"/></marker></defs>';
 for(let i=0;i<nodes.length;i++){
  const [name,y]=nodes[i];if(i)out+='<path d="M325 '+(y-70)+' V'+(y-31)+'" stroke="#17674f" stroke-width="2" marker-end="url(#flow-end)"/>';
  out+='<rect x="175" y="'+(y-30)+'" width="300" height="60" rx="9" fill="'+(i===1?'#d9f1e5':'#fff')+'" stroke="#17674f"/><text x="325" y="'+(y+7)+'" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#142923">'+name+'</text>';
 }
 out+='<path d="M175 165 H80 V65 H170 M175 365 H115 V265 H170 M475 665 H560 V565 H480" stroke="#17674f" stroke-width="2" fill="none" marker-end="url(#flow-end)"/><text x="10" y="110" font-size="17" fill="#52645c">重新取得</text><text x="10" y="318" font-size="17" fill="#52645c">回查、修正</text><text x="498" y="620" font-size="17" fill="#52645c">修正後重查</text><text x="487" y="271" font-size="17" fill="#52645c">重複五次</text></svg>';return out;
}
function renderProcess(){
 document.getElementById('process-content').innerHTML='<span class="eyebrow">PROJECT NOTES</span><h1>知識如何成為一份教學簡報</h1><p>先在對話確認範圍，逐篇讀取五個來源，整理為可維護的 Wiki，再查詢概念頁產生教學內容。</p><div class="summary-strip"><div><strong>5</strong><span>已 ingest 來源</span></div><div><strong>9</strong><span>概念頁</span></div><div><strong>16</strong><span>教學頁面</span></div><div><strong>3</strong><span>盤面練習</span></div></div><div class="flow-layout"><div><h2>實際採用的 graph</h2>'+flowSvg()+'</div><div><h2>實際反思</h2><h3>問題集中在哪裡？</h3><p>來源整合發現兩類差異：計分方法，以及貼目與版本設定。若直接混合，數目法與數子法會出現在同一個例題。</p><h3>把檢查往前移到哪裡？</h3><p>移到 ingest 前。先標記各篇規則版本與適用內容，再寫概念頁。S05 的舊版貼目保留在來源卡，例題另列教學設定。</p><h3>graph 有修改嗎？</h3><p>有。新增來源規則檢查，並在產生 HTML 前保留 Wiki 一致性檢查。盤面計算與內容檢查分別回到對應節點修正。</p><p class="small">本次以兩類實際問題描述單次執行，沒有把它冒充多輪錯誤率。</p><h3>驗證範圍</h3><p>棋盤、三題答案、簡單劫、數子計分與 Wiki 連結共 '+DATA.validation.passed+' 組檢查通過。HTML 程式另作語法與導航檢查。</p><p class="small">本環境沒有瀏覽器控制工具，未宣稱完成真實點擊與手機視覺測試。所有圖例均為自編，程式不是完整比賽引擎。</p></div></div><h2>來源整合的兩個決定</h2><div class="table-scroll"><table><thead><tr><th>差異</th><th>觀察</th><th>處理</th></tr></thead><tbody><tr><td>數目與數子</td><td>S01、S04 主例採數目；S05 定義兩種計分。</td><td>本課只採面積計分，不另加提子。</td></tr><tr><td>貼目與版本</td><td>S05 是 1991 版，寫 5.5；S04 提到 7.5。</td><td>例題明列白貼 6.5，作為自訂教學設定。</td></tr></tbody></table></div><h2>查詢 Wiki 的實際紀錄</h2><div class="table-scroll"><table><thead><tr><th>問題</th><th>讀取頁面</th><th>教學決定</th></tr></thead><tbody>'+DATA.queries.map(q=>'<tr><td>'+e(q.question)+'</td><td>'+q.pages.map(p=>'<a href="#wiki/'+p+'" data-route="wiki/'+p+'">'+e(DATA.pages.find(x=>x.slug===p).title)+'</a>').join('、')+'</td><td>'+e(q.decision)+'</td></tr>').join('')+'</tbody></table></div><details class="report-details"><summary>完整作業說明與反思</summary>'+DATA.report_html+'</details><p><button class="primary download-button" data-action="download">下載離線 HTML</button></p><p class="small">離線檔包含簡報、Wiki、來源及本頁，無需外部字型或程式庫。</p>';
}
function route(){
 const hash=location.hash.replace(/^#/,'');
 if(hash==='main')return;
 const parts=hash.split('/');view=['wiki','process'].includes(parts[0])?parts[0]:'lesson';
 ['lesson','wiki','process'].forEach(v=>{document.getElementById(v+'-view').hidden=v!==view;document.getElementById('tab-'+v).setAttribute('aria-pressed',String(v===view));});
 if(view==='lesson'){current=Math.max(0,Math.min(SLIDES.length-1,Number.parseInt(parts[1],10)||0));renderLesson();}
 else if(view==='wiki'){renderWiki(parts[1]||'index');document.getElementById('progress-bar').style.width='0';}
 else{renderProcess();document.getElementById('progress-bar').style.width='0';}
}
function go(path){if(location.hash==='#'+path){route();}else{location.hash=path;}window.scrollTo(0,0);}
document.getElementById('slidejump').innerHTML=SLIDES.map((s,i)=>'<option value="'+i+'">'+String(i+1).padStart(2,'0')+'　'+e(s.title)+'</option>').join('');
document.getElementById('slidejump').addEventListener('change',ev=>go('lesson/'+ev.target.value));
document.getElementById('wiki-search').addEventListener('input',filterWiki);
document.getElementById('previous').addEventListener('click',()=>{if(current>0)go('lesson/'+(current-1));});
document.getElementById('next').addEventListener('click',()=>{if(current<SLIDES.length-1)go('lesson/'+(current+1));});
document.addEventListener('click',ev=>{
 const nav=ev.target.closest('[data-route]');if(nav){ev.preventDefault();go(nav.dataset.route);return;}
 const answer=ev.target.closest('[data-answer]');if(answer){const [q,a]=answer.dataset.answer.split(':').map(Number);answers[q]=a;renderLesson();return;}
 const b=ev.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action;
 if(a==='liberty')libShown=!libShown;
 if(a==='capture')captured=!captured;
 if(a==='legal')legalExample=!legalExample;
 if(a==='ko')koAfter=!koAfter;
 if(a==='score')scoreShown=!scoreShown;
 if(a==='open-wiki'){go('wiki/index');return;}
 if(a==='open-process'){go('process');return;}
 if(a==='download'){
  const blob=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='go-beginner.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);return;
 }
 renderLesson();
});
document.addEventListener('keydown',ev=>{
 if(view!=='lesson'||['INPUT','TEXTAREA','SELECT'].includes(ev.target.tagName)||ev.target.isContentEditable||ev.altKey||ev.ctrlKey||ev.metaKey)return;
 if(ev.key==='ArrowRight'&&current<SLIDES.length-1){ev.preventDefault();go('lesson/'+(current+1));}
 if(ev.key==='ArrowLeft'&&current>0){ev.preventDefault();go('lesson/'+(current-1));}
});
window.addEventListener('hashchange',route);route();
</script>
