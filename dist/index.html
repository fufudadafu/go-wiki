<script id="content-data" type="application/json">{"date": "2026-11-23", "sources": [{"id": "S01", "title": "囲碁ってなあに？", "label": "圍棋是什麼？", "org": "日本棋院", "language": "日文", "url": "https://www.nihonkiin.or.jp/teach/gakkouigo/aboutigo.html", "sections": ["囲碁のルール", "終局"], "version": "頁面未標明規則版本", "points": ["以黑白棋輪流落在交叉點，建立對局的基本認識。", "提子、不能落子的位置與劫都有入門圖例。"], "note": "此頁終局示範以空點與提子處理，標為數目法資料；不把它當作本簡報的數子計算依據。", "quote": "囲碁は黒から順番に線と線の交差点に打ちます。"}, {"id": "S02", "title": "囲碁の基本：囲碁ゲームの２大要素", "label": "氣與提子", "org": "日本棋院", "language": "日文", "url": "https://www.nihonkiin.or.jp/teach/lesson/school/youso.html", "sections": ["呼吸点", "呼吸点を封じられると石は生きられない"], "version": "頁面未標明規則版本", "points": ["棋子上下左右的相鄰空點是氣，斜角不列入。", "同一塊棋的氣全部被占滿時，整塊棋一起移除。"], "note": "只抽取氣與提子的解釋。此頁另含日式提子計分敘述，保留規則標記。", "quote": "石の呼吸点は石の置かれた場所のナナメではなく、十字の線上にあります。"}, {"id": "S03", "title": "囲碁の基本：石を打てない所", "label": "合法落子與禁入點", "org": "日本棋院", "language": "日文", "url": "https://www.nihonkiin.or.jp/teach/lesson/school/kinshi.html", "sections": ["石を打てる所、打てない所"], "version": "頁面未標明規則版本", "points": ["判斷落子是否合法時，必須考慮提子之後的棋盤。", "若能先提走對方無氣的棋，落點原本被包圍也可能合法。"], "note": "不能簡化成『四周都是對手的棋就不能下』；練習題會檢查提子的例外。", "quote": "相手の石を取り上げることができる"}, {"id": "S04", "title": "How to Play", "label": "9 路盤入門、眼與劫", "org": "英國圍棋協會", "language": "英文", "url": "https://www.britgo.org/intro/intro2.html", "sections": ["Strings", "Life and death and the concept of eyes", "The ko rule", "Seki", "Komi"], "version": "頁面最後更新標示 2017-10-26", "points": ["以九路盤示範連接、眼、劫與雙活，適合安排入門順序。", "兩個分開的真眼可保障同一塊棋存活；雙活提醒我們不能把無兩眼一律當死棋。"], "note": "主文採數目計分並含 AGA 終局程序；這些設定不直接混入數子例題。其 7.5 貼目敘述也不視為所有棋盤通用。", "quote": "We recommend that beginners learn the basics on a 9 by 9 board"}, {"id": "S05", "title": "American Go Association Rules - Short Version", "label": "終局與數子法定義", "org": "AGA 制定，英國圍棋協會轉載", "language": "英文", "url": "https://www.britgo.org/rules/agashort.html", "sections": ["9) Ending the Game", "12) Counting"], "version": "1991 年 4 月版；轉載頁標示 2017-11-29 更新", "points": ["面積計分把盤上活子與所圍空點相加，已提走的棋子不再另加分。", "連續停一手後，仍需確認死活；存在爭議時要按所採規則處理。"], "note": "僅引用面積計分的定義及終局基本觀念。舊版 5.5 貼目、停一手交子、白最後行棋等屬該版本設定，不冒充完整中國規則。", "quote": "Prisoners are ignored."}], "pages": [{"slug": "board", "title": "棋盤與落子", "refs": ["S01", "S04", "S05"], "markdown": "## 基本概念\n棋子下在線與線的交叉點。一般平手對局由黑先白後，輪到自己可以在合法空點落一子，也可以停一手。落下的棋子留在原處，直到被提走。\n\n## 教學範圍\n本教學以 9 路盤示範，共有 81 個交叉點。19 路盤有 361 個交叉點。本課不使用讓子局。\n\n## 閱讀連結\n先看[氣與連接](liberties.md)，再看[打吃與提子](capture.md)。\n"}, {"slug": "liberties", "title": "氣與連接", "refs": ["S02", "S04", "S05"], "markdown": "## 定義\n上下左右相鄰的同色棋子形成同一塊棋。這塊棋相鄰的空交叉點集合，就是它的氣。\n\n## 數氣方法\n找出整塊棋，檢查每顆棋子的四個相鄰點，把重複空點只算一次。斜角既不是直接連接，也不直接提供氣。\n\n## 常見誤解\n不能直接把每顆棋子的氣相加，因為它們可能共用同一口氣。邊角交叉點的相鄰方向較少。\n\n## 閱讀連結\n接著看[打吃與提子](capture.md)與[合法落子](legal.md)。\n"}, {"slug": "capture", "title": "打吃與提子", "refs": ["S02", "S04", "S05"], "markdown": "## 基本判斷\n一塊棋只剩一口氣，稱為打吃。對手占住最後一口氣後，這塊棋失去所有氣，便整塊提離棋盤。\n\n## 與勝負的關係\n提子可以幫助保護自己的棋與取得空間。本課採用的面積計分，不把提走的棋子再額外加分。\n\n## 閱讀連結\n提子可能改變落子的合法性，請看[合法落子](legal.md)；勝負請看[數子法](scoring.md)。\n"}, {"slug": "legal", "title": "合法落子與禁入點", "refs": ["S03", "S05"], "markdown": "## 判斷順序\n先確認交叉點沒有棋子，再假設放下自己的棋，先提走因此無氣的對方棋塊。之後自己的棋塊仍須有氣，並且符合劫的限制。\n\n## 提子的例外\n一個空點即使四周都是對方棋子，落子若能提走對方棋子並取得氣，仍可能合法。不能只看落子前的外觀。\n\n## 本課邊界\n本課禁止自殺，僅用簡單劫展示不能立即提回。其他規則系統的自殺與全局重複判定不展開。\n\n## 閱讀連結\n搭配[打吃與提子](capture.md)與[劫](ko.md)閱讀。\n"}, {"slug": "ko", "title": "劫與立即提回限制", "refs": ["S01", "S04", "S05"], "markdown": "## 簡單劫\n有些局面中，一方提走一顆棋子後，對方若立刻提回，就會回到剛才的盤面。簡單劫的限制阻止這種立即反覆。\n\n## 教學用法\n用同一局面的提子前後圖比較，不把每一次提子都叫作劫。若對方沒有補劫，之後是否可提回，仍取決於局面與所採規則。\n\n## 版本邊界\nAGA 舊版還有全局重複盤面與輪次的規定。本課的局部示範與驗證程式只檢查簡單劫，並不是完整比賽規則引擎。\n\n## 閱讀連結\n返回[合法落子](legal.md)。\n"}, {"slug": "eyes", "title": "眼與簡單活棋", "refs": ["S04"], "markdown": "## 眼的概念\n眼是棋塊內部保留的空間。真眼與假眼需要根據周圍連接判斷，不能只憑看見一個空點就斷定。\n\n## 本課示範\n示範同一塊相連棋具有兩個分開真眼的情況。對手無法藉正常合法落子同時填滿兩眼，因此這塊棋可以存活。\n\n## 不可過度推論\n不能由此推論沒有兩眼就一定死；雙活是重要例外。本課只提示雙活存在，不教複雜判斷。\n\n## 閱讀連結\n接著看[終局](ending.md)。\n"}, {"slug": "ending", "title": "停一手與終局", "refs": ["S04", "S05"], "markdown": "## 終局流程\n當雙方認為沒有需要繼續下的地方，可以停一手。連續停一手通常表示進入終局確認，而不是略過死活判定直接算分。\n\n## 確認死活\n雙方先確認剩餘棋子的死活，移除同意的死子，再計分。有爭議時依採用規則續弈或處理，不能由程式憑外觀任意刪子。\n\n## 本課範例\n數子例題預先給定雙方已確認無死子，因此只計算明確的活子與單方所圍空點。此例不教 AGA 停一手交子等完整程序。\n\n## 閱讀連結\n閱讀[數子法](scoring.md)。\n"}, {"slug": "scoring", "title": "數子法與貼目", "refs": ["S05", "S01", "S04"], "markdown": "## 本課採用的定義\n面積計分把盤上活子數與己方所圍空點數相加。共同相鄰黑白兩色的中立空點不屬於任一方。提走的棋子不再另外加分。\n\n## 教學例題設定\n採 9 路盤、不讓子、白貼 6.5 分。這是清楚標示的教學設定，並非宣稱所有 9 路比賽都用相同貼目。\n自編終局中，黑活子 43、黑空點 2，白活子 34、白空點 2；雙方已確認無死子與中立點。黑得 45，白加貼目後得 42.5，黑勝 2.5 分。\n\n## 來源差異\nS01 與 S04 的主要終局範例採數目思路。S05 同時定義面積與地域兩種計分，且其 1991 版貼目為 5.5。本課僅取 S05 的面積定義，不把這些參數混作單一官方規則。\n\n## 閱讀連結\n返回[終局](ending.md)，或查[術語表](glossary.md)。\n"}, {"slug": "glossary", "title": "入門術語表", "refs": ["S01", "S02", "S03", "S04", "S05"], "markdown": "## 中英日對照\n氣：liberty，呼吸点。\n打吃：atari，アタリ。\n提子：capture，石を取る。\n眼：eye，眼。\n劫：ko，コウ。\n停一手：pass，パス。\n數子法：area counting，盤上活子與空點都計入。\n數目法：territory counting，處理地域及俘子；細節依規則而異。\n\n## 使用原則\n不同語言詞彙先統一再整合，不把所有規則差異都當翻譯問題。\n\n## 閱讀連結\n從[棋盤與落子](board.md)開始。\n"}], "queries": [{"question": "初學者從哪裡開始？", "pages": ["board", "liberties"], "decision": "先介紹交叉點與氣，使用 9 路盤。"}, {"question": "四周都是對手棋子就不能下嗎？", "pages": ["legal", "capture"], "decision": "先判斷能否提走對手棋，製作提子例外練習。"}, {"question": "沒有兩眼就一定死嗎？", "pages": ["eyes"], "decision": "補上雙活提示，保留規則邊界。"}, {"question": "計分是否還要加提子？", "pages": ["scoring", "ending"], "decision": "本課面積計分不另加提子，例題明列白貼 6.5。"}], "wiki": [{"key": "board", "title": "棋盤與落子", "kind": "概念", "html": "<h1>棋盤與落子<\/h1>\n<p>來源：<a href=\"#wiki/S01\" data-route=\"wiki/S01\">S01<\/a>、<a href=\"#wiki/S04\" data-route=\"wiki/S04\">S04<\/a>、<a href=\"#wiki/S05\" data-route=\"wiki/S05\">S05<\/a><\/p>\n<h2>基本概念<\/h2>\n<p>棋子下在線與線的交叉點。一般平手對局由黑先白後，輪到自己可以在合法空點落一子，也可以停一手。落下的棋子留在原處，直到被提走。<\/p>\n<h2>教學範圍<\/h2>\n<p>本教學以 9 路盤示範，共有 81 個交叉點。19 路盤有 361 個交叉點。本課不使用讓子局。<\/p>\n<h2>閱讀連結<\/h2>\n<p>先看<a href=\"#wiki/liberties\" data-route=\"wiki/liberties\">氣與連接<\/a>，再看<a href=\"#wiki/capture\" data-route=\"wiki/capture\">打吃與提子<\/a>。<\/p>", "search": "# 棋盤與落子\n\n來源：[S01](../sources/S01.md)、[S04](../sources/S04.md)、[S05](../sources/S05.md)\n\n## 基本概念\n棋子下在線與線的交叉點。一般平手對局由黑先白後，輪到自己可以在合法空點落一子，也可以停一手。落下的棋子留在原處，直到被提走。\n\n## 教學範圍\n本教學以 9 路盤示範，共有 81 個交叉點。19 路盤有 361 個交叉點。本課不使用讓子局。\n\n## 閱讀連結\n先看[氣與連接](liberties.md)，再看[打吃與提子](capture.md)。\n", "path": "wiki/concepts/board.md"}, {"key": "capture", "title": "打吃與提子", "kind": "概念", "html": "<h1>打吃與提子<\/h1>\n<p>來源：<a href=\"#wiki/S02\" data-route=\"wiki/S02\">S02<\/a>、<a href=\"#wiki/S04\" data-route=\"wiki/S04\">S04<\/a>、<a href=\"#wiki/S05\" data-route=\"wiki/S05\">S05<\/a><\/p>\n<h2>基本判斷<\/h2>\n<p>一塊棋只剩一口氣，稱為打吃。對手占住最後一口氣後，這塊棋失去所有氣，便整塊提離棋盤。<\/p>\n<h2>與勝負的關係<\/h2>\n<p>提子可以幫助保護自己的棋與取得空間。本課採用的面積計分，不把提走的棋子再額外加分。<\/p>\n<h2>閱讀連結<\/h2>\n<p>提子可能改變落子的合法性，請看<a href=\"#wiki/legal\" data-route=\"wiki/legal\">合法落子<\/a>；勝負請看<a href=\"#wiki/scoring\" data-route=\"wiki/scoring\">數子法<\/a>。<\/p>", "search": "# 打吃與提子\n\n來源：[S02](../sources/S02.md)、[S04](../sources/S04.md)、[S05](../sources/S05.md)\n\n## 基本判斷\n一塊棋只剩一口氣，稱為打吃。對手占住最後一口氣後，這塊棋失去所有氣，便整塊提離棋盤。\n\n## 與勝負的關係\n提子可以幫助保護自己的棋與取得空間。本課採用的面積計分，不把提走的棋子再額外加分。\n\n## 閱讀連結\n提子可能改變落子的合法性，請看[合法落子](legal.md)；勝負請看[數子法](scoring.md)。\n", "path": "wiki/concepts/capture.md"}, {"key": "ending", "title": "停一手與終局", "kind": "概念", "html": "<h1>停一手與終局<\/h1>\n<p>來源：<a href=\"#wiki/S04\" data-route=\"wiki/S04\">S04<\/a>、<a href=\"#wiki/S05\" data-route=\"wiki/S05\">S05<\/a><\/p>\n<h2>終局流程<\/h2>\n<p>當雙方認為沒有需要繼續下的地方，可以停一手。連續停一手通常表示進入終局確認，而不是略過死活判定直接算分。<\/p>\n<h2>確認死活<\/h2>\n<p>雙方先確認剩餘棋子的死活，移除同意的死子，再計分。有爭議時依採用規則續弈或處理，不能由程式憑外觀任意刪子。<\/p>\n<h2>本課範例<\/h2>\n<p>數子例題預先給定雙方已確認無死子，因此只計算明確的活子與單方所圍空點。此例不教 AGA 停一手交子等完整程序。<\/p>\n<h2>閱讀連結<\/h2>\n<p>閱讀<a href=\"#wiki/scoring\" data-route=\"wiki/scoring\">數子法<\/a>。<\/p>", "search": "# 停一手與終局\n\n來源：[S04](../sources/S04.md)、[S05](../sources/S05.md)\n\n## 終局流程\n當雙方認為沒有需要繼續下的地方，可以停一手。連續停一手通常表示進入終局確認，而不是略過死活判定直接算分。\n\n## 確認死活\n雙方先確認剩餘棋子的死活，移除同意的死子，再計分。有爭議時依採用規則續弈或處理，不能由程式憑外觀任意刪子。\n\n## 本課範例\n數子例題預先給定雙方已確認無死子，因此只計算明確的活子與單方所圍空點。此例不教 AGA 停一手交子等完整程序。\n\n## 閱讀連結\n閱讀[數子法](scoring.md)。\n", "path": "wiki/concepts/ending.md"}, {"key": "eyes", "title": "眼與簡單活棋", "kind": "概念", "html": "<h1>眼與簡單活棋<\/h1>\n<p>來源：<a href=\"#wiki/S04\" data-route=\"wiki/S04\">S04<\/a><\/p>\n<h2>眼的概念<\/h2>\n<p>眼是棋塊內部保留的空間。真眼與假眼需要根據周圍連接判斷，不能只憑看見一個空點就斷定。<\/p>\n<h2>本課示範<\/h2>\n<p>示範同一塊相連棋具有兩個分開真眼的情況。對手無法藉正常合法落子同時填滿兩眼，因此這塊棋可以存活。<\/p>\n<h2>不可過度推論<\/h2>\n<p>不能由此推論沒有兩眼就一定死；雙活是重要例外。本課只提示雙活存在，不教複雜判斷。<\/p>\n<h2>閱讀連結<\/h2>\n<p>接著看<a href=\"#wiki/ending\" data-route=\"wiki/ending\">終局<\/a>。<\/p>", "search": "# 眼與簡單活棋\n\n來源：[S04](../sources/S04.md)\n\n## 眼的概念\n眼是棋塊內部保留的空間。真眼與假眼需要根據周圍連接判斷，不能只憑看見一個空點就斷定。\n\n## 本課示範\n示範同一塊相連棋具有兩個分開真眼的情況。對手無法藉正常合法落子同時填滿兩眼，因此這塊棋可以存活。\n\n## 不可過度推論\n不能由此推論沒有兩眼就一定死；雙活是重要例外。本課只提示雙活存在，不教複雜判斷。\n\n## 閱讀連結\n接著看[終局](ending.md)。\n", "path": "wiki/concepts/eyes.md"}, {"key": "glossary", "title": "入門術語表", "kind": "概念", "html": "<h1>入門術語表<\/h1>\n<p>來源：<a href=\"#wiki/S01\" data-route=\"wiki/S01\">S01<\/a>、<a href=\"#wiki/S02\" data-route=\"wiki/S02\">S02<\/a>、<a href=\"#wiki/S03\" data-route=\"wiki/S03\">S03<\/a>、<a href=\"#wiki/S04\" data-route=\"wiki/S04\">S04<\/a>、<a href=\"#wiki/S05\" data-route=\"wiki/S05\">S05<\/a><\/p>\n<h2>中英日對照<\/h2>\n<p>氣：liberty，呼吸点。<\/p>\n<p>打吃：atari，アタリ。<\/p>\n<p>提子：capture，石を取る。<\/p>\n<p>眼：eye，眼。<\/p>\n<p>劫：ko，コウ。<\/p>\n<p>停一手：pass，パス。<\/p>\n<p>數子法：area counting，盤上活子與空點都計入。<\/p>\n<p>數目法：territory counting，處理地域及俘子；細節依規則而異。<\/p>\n<h2>使用原則<\/h2>\n<p>不同語言詞彙先統一再整合，不把所有規則差異都當翻譯問題。<\/p>\n<h2>閱讀連結<\/h2>\n<p>從<a href=\"#wiki/board\" data-route=\"wiki/board\">棋盤與落子<\/a>開始。<\/p>", "search": "# 入門術語表\n\n來源：[S01](../sources/S01.md)、[S02](../sources/S02.md)、[S03](../sources/S03.md)、[S04](../sources/S04.md)、[S05](../sources/S05.md)\n\n## 中英日對照\n氣：liberty，呼吸点。\n打吃：atari，アタリ。\n提子：capture，石を取る。\n眼：eye，眼。\n劫：ko，コウ。\n停一手：pass，パス。\n數子法：area counting，盤上活子與空點都計入。\n數目法：territory counting，處理地域及俘子；細節依規則而異。\n\n## 使用原則\n不同語言詞彙先統一再整合，不把所有規則差異都當翻譯問題。\n\n## 閱讀連結\n從[棋盤與落子](board.md)開始。\n", "path": "wiki/concepts/glossary.md"}, {"key": "ko", "title": "劫與立即提回限制", "kind": "概念", "html": "<h1>劫與立即提回限制<\/h1>\n<p>來源：<a href=\"#wiki/S01\" data-route=\"wiki/S01\">S01<\/a>、<a href=\"#wiki/S04\" data-route=\"wiki/S04\">S04<\/a>、<a href=\"#wiki/S05\" data-route=\"wiki/S05\">S05<\/a><\/p>\n<h2>簡單劫<\/h2>\n<p>有些局面中，一方提走一顆棋子後，對方若立刻提回，就會回到剛才的盤面。簡單劫的限制阻止這種立即反覆。<\/p>\n<h2>教學用法<\/h2>\n<p>用同一局面的提子前後圖比較，不把每一次提子都叫作劫。若對方沒有補劫，之後是否可提回，仍取決於局面與所採規則。<\/p>\n<h2>版本邊界<\/h2>\n<p>AGA 舊版還有全局重複盤面與輪次的規定。本課的局部示範與驗證程式只檢查簡單劫，並不是完整比賽規則引擎。<\/p>\n<h2>閱讀連結<\/h2>\n<p>返回<a href=\"#wiki/legal\" data-route=\"wiki/legal\">合法落子<\/a>。<\/p>", "search": "# 劫與立即提回限制\n\n來源：[S01](../sources/S01.md)、[S04](../sources/S04.md)、[S05](../sources/S05.md)\n\n## 簡單劫\n有些局面中，一方提走一顆棋子後，對方若立刻提回，就會回到剛才的盤面。簡單劫的限制阻止這種立即反覆。\n\n## 教學用法\n用同一局面的提子前後圖比較，不把每一次提子都叫作劫。若對方沒有補劫，之後是否可提回，仍取決於局面與所採規則。\n\n## 版本邊界\nAGA 舊版還有全局重複盤面與輪次的規定。本課的局部示範與驗證程式只檢查簡單劫，並不是完整比賽規則引擎。\n\n## 閱讀連結\n返回[合法落子](legal.md)。\n", "path": "wiki/concepts/ko.md"}, {"key": "legal", "title": "合法落子與禁入點", "kind": "概念", "html": "<h1>合法落子與禁入點<\/h1>\n<p>來源：<a href=\"#wiki/S03\" data-route=\"wiki/S03\">S03<\/a>、<a href=\"#wiki/S05\" data-route=\"wiki/S05\">S05<\/a><\/p>\n<h2>判斷順序<\/h2>\n<p>先確認交叉點沒有棋子，再假設放下自己的棋，先提走因此無氣的對方棋塊。之後自己的棋塊仍須有氣，並且符合劫的限制。<\/p>\n<h2>提子的例外<\/h2>\n<p>一個空點即使四周都是對方棋子，落子若能提走對方棋子並取得氣，仍可能合法。不能只看落子前的外觀。<\/p>\n<h2>本課邊界<\/h2>\n<p>本課禁止自殺，僅用簡單劫展示不能立即提回。其他規則系統的自殺與全局重複判定不展開。<\/p>\n<h2>閱讀連結<\/h2>\n<p>搭配<a href=\"#wiki/capture\" data-route=\"wiki/capture\">打吃與提子<\/a>與<a href=\"#wiki/ko\" data-route=\"wiki/ko\">劫<\/a>閱讀。<\/p>", "search": "# 合法落子與禁入點\n\n來源：[S03](../sources/S03.md)、[S05](../sources/S05.md)\n\n## 判斷順序\n先確認交叉點沒有棋子，再假設放下自己的棋，先提走因此無氣的對方棋塊。之後自己的棋塊仍須有氣，並且符合劫的限制。\n\n## 提子的例外\n一個空點即使四周都是對方棋子，落子若能提走對方棋子並取得氣，仍可能合法。不能只看落子前的外觀。\n\n## 本課邊界\n本課禁止自殺，僅用簡單劫展示不能立即提回。其他規則系統的自殺與全局重複判定不展開。\n\n## 閱讀連結\n搭配[打吃與提子](capture.md)與[劫](ko.md)閱讀。\n", "path": "wiki/concepts/legal.md"}, {"key": "liberties", "title": "氣與連接", "kind": "概念", "html": "<h1>氣與連接<\/h1>\n<p>來源：<a href=\"#wiki/S02\" data-route=\"wiki/S02\">S02<\/a>、<a href=\"#wiki/S04\" data-route=\"wiki/S04\">S04<\/a>、<a href=\"#wiki/S05\" data-route=\"wiki/S05\">S05<\/a><\/p>\n<h2>定義<\/h2>\n<p>上下左右相鄰的同色棋子形成同一塊棋。這塊棋相鄰的空交叉點集合，就是它的氣。<\/p>\n<h2>數氣方法<\/h2>\n<p>找出整塊棋，檢查每顆棋子的四個相鄰點，把重複空點只算一次。斜角既不是直接連接，也不直接提供氣。<\/p>\n<h2>常見誤解<\/h2>\n<p>不能直接把每顆棋子的氣相加，因為它們可能共用同一口氣。邊角交叉點的相鄰方向較少。<\/p>\n<h2>閱讀連結<\/h2>\n<p>接著看<a href=\"#wiki/capture\" data-route=\"wiki/capture\">打吃與提子<\/a>與<a href=\"#wiki/legal\" data-route=\"wiki/legal\">合法落子<\/a>。<\/p>", "search": "# 氣與連接\n\n來源：[S02](../sources/S02.md)、[S04](../sources/S04.md)、[S05](../sources/S05.md)\n\n## 定義\n上下左右相鄰的同色棋子形成同一塊棋。這塊棋相鄰的空交叉點集合，就是它的氣。\n\n## 數氣方法\n找出整塊棋，檢查每顆棋子的四個相鄰點，把重複空點只算一次。斜角既不是直接連接，也不直接提供氣。\n\n## 常見誤解\n不能直接把每顆棋子的氣相加，因為它們可能共用同一口氣。邊角交叉點的相鄰方向較少。\n\n## 閱讀連結\n接著看[打吃與提子](capture.md)與[合法落子](legal.md)。\n", "path": "wiki/concepts/liberties.md"}, {"key": "scoring", "title": "數子法與貼目", "kind": "概念", "html": "<h1>數子法與貼目<\/h1>\n<p>來源：<a href=\"#wiki/S05\" data-route=\"wiki/S05\">S05<\/a>、<a href=\"#wiki/S01\" data-route=\"wiki/S01\">S01<\/a>、<a href=\"#wiki/S04\" data-route=\"wiki/S04\">S04<\/a><\/p>\n<h2>本課採用的定義<\/h2>\n<p>面積計分把盤上活子數與己方所圍空點數相加。共同相鄰黑白兩色的中立空點不屬於任一方。提走的棋子不再另外加分。<\/p>\n<h2>教學例題設定<\/h2>\n<p>採 9 路盤、不讓子、白貼 6.5 分。這是清楚標示的教學設定，並非宣稱所有 9 路比賽都用相同貼目。<\/p>\n<p>自編終局中，黑活子 43、黑空點 2，白活子 34、白空點 2；雙方已確認無死子與中立點。黑得 45，白加貼目後得 42.5，黑勝 2.5 分。<\/p>\n<h2>來源差異<\/h2>\n<p>S01 與 S04 的主要終局範例採數目思路。S05 同時定義面積與地域兩種計分，且其 1991 版貼目為 5.5。本課僅取 S05 的面積定義，不把這些參數混作單一官方規則。<\/p>\n<h2>閱讀連結<\/h2>\n<p>返回<a href=\"#wiki/ending\" data-route=\"wiki/ending\">終局<\/a>，或查<a href=\"#wiki/glossary\" data-route=\"wiki/glossary\">術語表<\/a>。<\/p>", "search": "# 數子法與貼目\n\n來源：[S05](../sources/S05.md)、[S01](../sources/S01.md)、[S04](../sources/S04.md)\n\n## 本課採用的定義\n面積計分把盤上活子數與己方所圍空點數相加。共同相鄰黑白兩色的中立空點不屬於任一方。提走的棋子不再另外加分。\n\n## 教學例題設定\n採 9 路盤、不讓子、白貼 6.5 分。這是清楚標示的教學設定，並非宣稱所有 9 路比賽都用相同貼目。\n自編終局中，黑活子 43、黑空點 2，白活子 34、白空點 2；雙方已確認無死子與中立點。黑得 45，白加貼目後得 42.5，黑勝 2.5 分。\n\n## 來源差異\nS01 與 S04 的主要終局範例採數目思路。S05 同時定義面積與地域兩種計分，且其 1991 版貼目為 5.5。本課僅取 S05 的面積定義，不把這些參數混作單一官方規則。\n\n## 閱讀連結\n返回[終局](ending.md)，或查[術語表](glossary.md)。\n", "path": "wiki/concepts/scoring.md"}, {"key": "index", "title": "圍棋 LLM Wiki", "kind": "維護", "html": "<h1>圍棋 LLM Wiki<\/h1>\n<p>對象：完全新手。示範棋盤：9 路。教學計分：面積計分，例題另外列出貼目。<\/p>\n<h2>概念目錄<\/h2>\n<ul>\n<li><a href=\"#wiki/board\" data-route=\"wiki/board\">棋盤與落子<\/a><\/li>\n<li><a href=\"#wiki/liberties\" data-route=\"wiki/liberties\">氣與連接<\/a><\/li>\n<li><a href=\"#wiki/capture\" data-route=\"wiki/capture\">打吃與提子<\/a><\/li>\n<li><a href=\"#wiki/legal\" data-route=\"wiki/legal\">合法落子與禁入點<\/a><\/li>\n<li><a href=\"#wiki/ko\" data-route=\"wiki/ko\">劫與立即提回限制<\/a><\/li>\n<li><a href=\"#wiki/eyes\" data-route=\"wiki/eyes\">眼與簡單活棋<\/a><\/li>\n<li><a href=\"#wiki/ending\" data-route=\"wiki/ending\">停一手與終局<\/a><\/li>\n<li><a href=\"#wiki/scoring\" data-route=\"wiki/scoring\">數子法與貼目<\/a><\/li>\n<li><a href=\"#wiki/glossary\" data-route=\"wiki/glossary\">入門術語表<\/a><\/li>\n<\/ul>\n<h2>五篇已 ingest 來源<\/h2>\n<ul>\n<li><a href=\"#wiki/S01\" data-route=\"wiki/S01\">S01 圍棋是什麼？<\/a><\/li>\n<li><a href=\"#wiki/S02\" data-route=\"wiki/S02\">S02 氣與提子<\/a><\/li>\n<li><a href=\"#wiki/S03\" data-route=\"wiki/S03\">S03 合法落子與禁入點<\/a><\/li>\n<li><a href=\"#wiki/S04\" data-route=\"wiki/S04\">S04 9 路盤入門、眼與劫<\/a><\/li>\n<li><a href=\"#wiki/S05\" data-route=\"wiki/S05\">S05 終局與數子法定義<\/a><\/li>\n<\/ul>\n<h2>維護紀錄<\/h2>\n<ul>\n<li><a href=\"#wiki/log\" data-route=\"wiki/log\">實際執行紀錄<\/a><\/li>\n<li><a href=\"#wiki/synthesis\" data-route=\"wiki/synthesis\">規則差異與使用邊界<\/a><\/li>\n<\/ul>", "search": "# 圍棋 LLM Wiki\n\n對象：完全新手。示範棋盤：9 路。教學計分：面積計分，例題另外列出貼目。\n\n## 概念目錄\n- [棋盤與落子](concepts/board.md)\n- [氣與連接](concepts/liberties.md)\n- [打吃與提子](concepts/capture.md)\n- [合法落子與禁入點](concepts/legal.md)\n- [劫與立即提回限制](concepts/ko.md)\n- [眼與簡單活棋](concepts/eyes.md)\n- [停一手與終局](concepts/ending.md)\n- [數子法與貼目](concepts/scoring.md)\n- [入門術語表](concepts/glossary.md)\n\n## 五篇已 ingest 來源\n- [S01 圍棋是什麼？](sources/S01.md)\n- [S02 氣與提子](sources/S02.md)\n- [S03 合法落子與禁入點](sources/S03.md)\n- [S04 9 路盤入門、眼與劫](sources/S04.md)\ 理重點\n- 以黑白棋輪流落在交叉點，建立對局的基本認識。\n- 提子、不能落子的位置與劫都有入門圖例。\n\n## 適用範圍與檢查\n此頁終局示範以空點與提子處理，標為數目法資料；不把它當作本簡報的數子計算依據。\n\n## 相關概念\n- [棋盤與落子](../concepts/board.md)\n- [劫與立即提回限制](../concepts/ko.md)\n- [數子法與貼目](../concepts/scoring.md)\n- [入門術語表](../concepts/glossary.md)\n", "path": "wiki/sources/S01.md"}, {"key": "S02", "title": "S02 氣與提子", "kind": "來源", "html": "<h1>S02 氣與提子<\/h1>\n<p>原題：囲碁の基本：囲碁ゲームの２大要素<\/p>\n<p>機構：日本棋院<\/p>\n<p>語言：日文<\/p>\n<p>版本：頁面未標明規則版本<\/p>\n<p>取得日期：2026-11-23<\/p>\n<p><a href=\"https://www.nihonkiin.or.jp/teach/lesson/school/youso.html\" target=\"_blank\" rel=\"noopener noreferrer\">原始網頁<\/a><\/p>\n<h2>閱讀段落<\/h2>\n<ul>\n<li>呼吸点<\/li>\n<li>呼吸点を封じられると石は生きられない<\/li>\n<\/ul>\n<h2>整理重點<\/h2>\n<ul>\n<li>棋子上下左右的相鄰空點是氣，斜角不列入。<\/li>\n<li>同一塊棋的氣全部被占滿時，整塊棋一起移除。<\/li>\n<\/ul>\n<h2>適用範圍與檢查<\/h2>\n<p>只抽取氣與提子的解釋。此頁另含日式提子計分敘述，保留規則標記。<\/p>\n<h2>相關概念<\/h2>\n<ul>\n<li><a href=\"#wiki/liberties\" data-route=\"wiki/liberties\">氣與連接<\/a><\/li>\n<li><a href=\"#wiki/capture\" data-route=\"wiki/capture\">打吃與提子<\/a><\/li>\n<li><a href=\"#wiki/glossary\" data-route=\"wiki/glossary\">入門術語表<\/a><\/li>\n<\/ul>", "search": "# S02 氣與提子\n\n原題：囲碁の基本：囲碁ゲームの２大要素\n\n機構：日本棋院\n\n語言：日文\n\n版本：頁面未標明規則版本\n\n取得日期：2026-11-23\n\n[原始網頁](https://www.nihonkiin.or.jp/teach/lesson/school/youso.html)\n\n## 閱讀段落\n- 呼吸点\n- 呼吸点を封じられると石は生きられない\n\n## 整理重點\n- 棋子上下左右的相鄰空點是氣，斜角不列入。\n- 同一塊棋的氣全部被占滿時，整塊棋一起移除。\n\n## 適用範圍與檢查\n只抽取氣與提子的解釋。此頁另含日式提子計分敘述，保留規則標記。\n\n## 相關概念\n- [氣與連接](../concepts/liberties.md)\n- [打吃與提子](../concepts/capture.md)\n- [入門術語表](../concepts/glossary.md)\n", "path": "wiki/sources/S02.md"}, {"key": "S03", "title": "S03 合法落子與禁入點", "kind": "來源", "html": "<h1>S03 合法落子與禁入點<\/h1>\n<p>原題：囲碁の基本：石を打てない所<\/p>\n<p>機構：日本棋院<\/p>\n<p>語言：日文<\/p>\n<p>版本：頁面未標明規則版本<\/p>\n<p>取得日期：2026-11-23<\/p>\n<p><a href=\"https://www.nihonkiin.or.jp/teach/lesson/school/kinshi.html\" target=\"_blank\" rel=\"noopener noreferrer\">原始網頁<\/a><\/p>\n<h2>閱讀段落<\/h2>\n<ul>\n<li>石を打てる所、打てない所<\/li>\n<\/ul>\n<h2>整理重點<\/h2>\n<ul>\n<li>判斷落子是否合法時，必須考慮提子之後的棋盤。<\/li>\n<li>若能先提走對方無氣的棋，落點原本被包圍也可能合法。<\/li>\n<\/ul>\n<h2>適用範圍與檢查<\/h2>\n<p>不能簡化成『四周都是對手的棋就不能下』；練習題會檢查提子的例外。<\/p>\n<h2>相關概念<\/h2>\n<ul>\n<li><a href=\"#wiki/legal\" data-route=\"wiki/legal\">合法落子與禁入點<\/a><\/li>\n<li><a href=\"#wiki/glossary\" data-route=\"wiki/glossary\">入門術語表<\/a><\/li>\n<\/ul>", "search": "# S03 合法落子與禁入點\n\n原題：囲碁の基本：石を打てない所\n\n機構：日本棋院\n\n語言：日文\n\n版本：頁面未標明規則版本\n\n取得日期：2026-11-23\n\n[原始網頁](https://www.nihonkiin.or.jp/teach/lesson/school/kinshi.html)\n\n## 閱讀段落\n- 石を打てる所、打てない所\n\n## 整理重點\n- 判斷落子是否合法時，必須考慮提子之後的棋盤。\n- 若能先提走對方無氣的棋，落點原本被包圍也可能合法。\n\n## 適用範圍與檢查\n不能簡化成『四周都是對手的棋就不能下』；練習題會檢查提子的例外。\n\n## 相關概念\n- [合法落子與禁入點](../concepts/legal.md)\n- [入門術語表](../concepts/glossary.md)\n", "path": "wiki/sources/S03.md"}, {"key": "S04", "title": "S04 9 路盤入門、眼與劫", "kind": "來源", "html": "<h1>S04 9 路盤入門、眼與劫<\/h1>\n<p>原題：How to Play<\/p>\n<p>機構：英國圍棋協會<\/p>\n<p>語言：英文<\/p>\n<p>版本：頁面最後更新標示 2017-10-26<\/p>\n<p>取得日期：2026-11-23<\/p>\n<p><a href=\"https://www.britgo.org/intro/intro2.html\" target=\"_blank\" rel=\"noopener noreferrer\">原始網頁<\/a><\/p>\n<h2>閱讀段落<\/h2>\n<ul>\n<li>Strings<\/li>\n<li>Life and death and the concept of eyes<\/li>\n<li>The ko rule<\/li>\n<li>Seki<\/li>\n<li>Komi<\/li>\n<\/ul>\n<h2>整理重點<\/h2>\n<ul>\n<li>以九路盤示範連接、眼、劫與雙活，適合安排入門順序。<\/li>\n<li>兩個分開的真眼可保障同一塊棋存活；雙活提醒我們不能把無兩眼一律當死棋。<\/li>\n<\/ul>\n<h2>適用範圍與檢查<\/h2>\n<p>主文採數目計分並含 AGA 終局程序；這些設定不直接混入數子例題。其 7.5 貼目敘述也不視為所有棋盤通用。<\/p>\n<h2>相關概念<\/h2>\n<ul>\n<li><a href=\"#wiki/board\" data-route=\"wiki/board\">棋盤與落子<\/a><\/li>\n<li><a href=\"#wiki/liberties\" data-route=\"wiki/liberties\">氣與連接<\/a><\/li>\n<li><a href=\"#wiki/capture\" data-route=\"wiki/capture\">打吃與提子<\/a><\/li>\n<li><a href=\"#wiki/ko\" data-route=\"wiki/ko\">劫與立即提回限制<\/a><\/li>\n<li><a href=\"#wiki/eyes\" data-route=\"wiki/eyes\">眼與簡單活棋<\/a><\/li>\n<li><a href=\"#wiki/ending\" data-route=\"wiki/ending\">停一手與終局<\/a><\/li>\n<li><a href=\"#wiki/scoring\" data-route=\"wiki/scoring\">數子法與貼目<\/a><\/li>\n<li><a href=\"#wiki/glossary\" data-route=\"wiki/glossary\">入門術語表<\/a><\/li>\n<\/ul>", "search": "# S04 9 路盤入門、眼與劫\n\n原題：How to Play\n\n機構：英國圍棋協會\n\n語言：英文\n\n版本：頁面最後更新標示 2017-10-26\n\n取得日期：2026-11-23\n\n[原始網頁](https://www.britgo.org/intro/intro2.html)\n\n## 閱讀段落\n- Strings\n- Life and death and the concept of eyes\n- The ko rule\n- Seki\n- Komi\n\n## 整理重點\n- 以九路盤示範連接、眼、劫與雙活，適合安排入門順序。\n- 兩個分開的真眼可保障同一塊棋存活；雙活提醒我們不能把無兩眼一律當死棋。\n\n## 適用範圍與檢查\n主文採數目計分並含 AGA 終局程序；這些設定不直接混入數子例題。其 7.5 貼目敘述也不視為所有棋盤通用。\n\n## 相關概念\n- [棋盤與落子](../concepts/board.md)\n- [氣與連接](../concepts/liberties.md)\n- [打吃與提子](../concepts/capture.md)\n- [劫與立即提回限制](../concepts/ko.md)\n- [眼與簡單活棋](../concepts/eyes.md)\n- [停一手與終局](../concepts/ending.md)\n- [數子法與貼目](../concepts/scoring.md)\n- [入門術語表](../concepts/glossary.md)\n", "path": "wiki/sources/S04.md"}, {"key": "S05", "title": "S05 終局與數子法定義", "kind": "來源", "html": "<h1>S05 終局與數子法定義<\/h1>\n<p>原題：American Go Association Rules - Short Version<\/p>\n<p>機構：AGA 制定，英國圍棋協會轉載<\/p>\n<p>語言：英文<\/p>\n<p>版本：1991 年 4 月版；轉載頁標示 2017-11-29 更新<\/p>\n<p>取得日期：2026-11-23<\/p>\n<p><a href=\"https://www.britgo.org/rules/agashort.html\" target=\"_blank\" rel=\"noopener noreferrer\">原始網頁<\/a><\/p>\n<h2>閱讀段落<\/h2>\n<ul>\n<li>9) Ending the Game<\/li>\n<li>12) Counting<\/li>\n<\/ul>\n<h2>整理重點<\/h2>\n<ul>\n<li>面積計分把盤上活子與所圍空點相加，已提走的棋子不再另加分。<\/li>\n<li>連續停一手後，仍需確認死活；存在爭議時要按所採規則處理。<\/li>\n<\/ul>\n<h2>適用範圍與檢查<\/h2>\n<p>僅引用面積計分的定義及終局基本觀念。舊版 5.5 貼目、停一手交子、白最後行棋等屬該版本設定，不冒充完整中國規則。<\/p>\n<h2>相關概念<\/h2>\n<ul>\n<li><a href=\"#wiki/board\" data-route=\"wiki/board\">棋盤與落子<\/a><\/li>\n<li><a href=\"#wiki/liberties\" data-route=\"wiki/liberties\">氣與連接<\/a><\/li>\n<li><a href=\"#wiki/capture\" data-route=\"wiki/capture\">打吃與提子<\/a><\/li>\n<li><a href=\"#wiki/legal\" data-route=\"wiki/legal\">合法落子與禁入點<\/a><\/li>\n<li><a href=\"#wiki/ko\" data-route=\"wiki/ko\">劫與立即提回限制<\/a><\/li>\n<li><a href=\"#wiki/ending\" data-route=\"wiki/ending\">停一手與終局<\/a><\/li>\n<li><a href=\"#wiki/scoring\" data-route=\"wiki/scoring\">數子法與貼目<\/a><\/li>\n<li><a href=\"#wiki/glossary\" data-route=\"wiki/glossary\">入門術語表<\/a><\/li>\n<\/ul>", "search": "# S05 終局與數子法定義\n\n原題：American Go Association Rules - Short Version\n\n機構：AGA 制定，英國圍棋協會轉載\n\n語言：英文\n\n版本：1991 年 4 月版；轉載頁標示 2017-11-29 更新\n\n取得日期：2026-11-23\n\n[原始網頁](https://www.britgo.org/rules/agashort.html)\n\n## 閱讀段落\n- 9) Ending the Game\n- 12) Counting\n\n## 整理重點\n- 面積計分把盤上活子與所圍空點相加，已提走的棋子不再另加分。\n- 連續停一手後，仍需確認死活；存在爭議時要按所採規則處理。\n\n## 適用範圍與檢查\n僅引用面積計分的定義及終局基本觀念。舊版 5.5 貼目、停一手交子、白最後行棋等屬該版本設定，不冒充完整中國規則。\n\n## 相關概念\n- [棋盤與落子](../concepts/board.md)\n- [氣與連接](../concepts/liberties.md)\n- [打吃與提子](../concepts/capture.md)\n- [合法落子與禁入點](../concepts/legal.md)\n- [劫與立即提回限制](../concepts/ko.md)\n- [停一手與終局](../concepts/ending.md)\n- [數子法與貼目](../concepts/scoring.md)\n- [入門術語表](../concepts/glossary.md)\n", "path": "wiki/sources/S05.md"}, {"key": "synthesis", "title": "規則差異與使用邊界", "kind": "維護", "html": "<h1>規則差異與使用邊界<\/h1>\n<div class=\"table-scroll\"><table><thead><tr><th>議題<\/th><th>觀察<\/th><th>本專案處理<\/th><\/tr><\/thead><tbody>\n<tr><td>計分方法<\/td><td>S01、S02 與 S04 含數目計分；S05 同時列出面積與地域計分<\/td><td>只用 S05 的面積定義製作數子例題<\/td><\/tr>\n<tr><td>貼目與版本<\/td><td>S05 是 1991 版，寫 5.5；S04 提到比賽常用 7.5，情境不同<\/td><td>教學題自行明列白貼 6.5，不宣稱通用<\/td><\/tr>\n<tr><td>終局程序<\/td><td>AGA 文本含停一手交子及白最後行棋<\/td><td>不把這些細節冒充中國規則；本課只教基本概念<\/td><\/tr>\n<tr><td>活棋<\/td><td>兩眼是簡單可靠形狀，但 S04 另說明雙活<\/td><td>不寫成沒有兩眼一律死<\/td><\/tr>\n<tr><td>劫的範圍<\/td><td>S05 涉及全局重複盤面；簡報只展示局部簡單劫<\/td><td>檢查程式標示僅驗證教學例圖<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h2>整合方法<\/h2>\n<p>先讀來源卡，再把共通定義整合進概念頁。矛盾或版本差異先留在這一頁，經明確選擇才進入教學內容。<\/p>\n<p>來源頁與概念頁互相連結，所有概念都有來源，後續新增資料時可找到受影響頁面。<\/p>", "search": "# 規則差異與使用邊界\n\n| 議題 | 觀察 | 本專案處理 |\n| --- | --- | --- |\n| 計分方法 | S01、S02 與 S04 含數目計分；S05 同時列出面積與地域計分 | 只用 S05 的面積定義製作數子例題 |\n| 貼目與版本 | S05 是 1991 版，寫 5.5；S04 提到比賽常用 7.5，情境不同 | 教學題自行明列白貼 6.5，不宣稱通用 |\n| 終局程序 | AGA 文本含停一手交子及白最後行棋 | 不把這些細節冒充中國規則；本課只教基本概念 |\n| 活棋 | 兩眼是簡單可靠形狀，但 S04 另說明雙活 | 不寫成沒有兩眼一律死 |\n| 劫的範圍 | S05 涉及全局重複盤面；簡報只展示局部簡單劫 | 檢查程式標示僅驗證教學例圖 |\n\n## 整合方法\n先讀來源卡，再把共通定義整合進概念頁。矛盾或版本差異先留在這一頁，經明確選擇才進入教學內容。\n來源頁與概念頁互相連結，所有概念都有來源，後續新增資料時可找到受影響頁面。\n", "path": "wiki/synthesis.md"}], "report_html": "<h1>圍棋 LLM Wiki 與 HTML 教學簡報：作業說明<\/h1>\n<h2>專案簡介<\/h2>\n<p>本專案為完全不熟悉圍棋的人建立知識庫，使用五篇已實際讀取的公開資料整理來源卡與九篇互相連結的概念頁，再查詢 Wiki 製作十六頁繁體中文 HTML 教學簡報。採九路盤圖解，包含數氣、提子與合法落子三題互動練習。<\/p>\n<h2>先討論、後生成<\/h2>\n<p>使用者在對話中先提出圍棋主題，與 AI 確認對象、教學目標、納入與排除的概念，以及五類資料方向。使用者之後確認新手、九路盤、數子法與三題練習，再要求先列五個來源，最後授權開始製作。這是實際討論順序。若老師需要對話截圖，請另由原對話擷取，本專案沒有虛構截圖。<\/p>\n<h2>實際 ingest<\/h2>\n<p>五篇資料均在本次對話中以網頁工具讀取正文，再逐篇建立 raw/S01.json 至 S05.json、來源摘要及索引。讀取後以繁體中文整合九篇概念頁，記錄規則差異並互相連結。raw 保存的是網址、讀取段落、有限摘錄與固定閱讀紀錄，並非完整原文備份。<\/p>\n<h2>Workflow 與 graph<\/h2>\n<p>初版流程是取得資料、逐篇整理、查詢 Wiki、產生 HTML、檢查。實際讀取時發現來源混用計分方法與不同貼目設定，因此在 ingest 前加入來源可讀性、計分規則與版本檢查。<\/p>\n<p>現在的流程是：取得資料、檢查正文及規則版本、逐篇 ingest、Wiki 一致性檢查、查詢 Wiki 與整理教學順序、產生 HTML、盤面與功能檢查、完成。HTML 的「流程與反思」頁有可閱讀的流程圖。<\/p>\n<h2>哪些步驟會重複<\/h2>\n<ul>\n<li>每篇來源重複讀取、分類、摘要與更新索引，共五次。<\/li>\n<li>原文讀不到或規則版本不明，回到取得來源節點。<\/li>\n<li>Wiki 的術語或計分不一致，回到來源分類與概念整合節點。<\/li>\n<li>例題盤面或答案不符，修正例題後重跑盤面檢查。<\/li>\n<li>HTML 程式或內部連結有問題，修正後重新檢查。<\/li>\n<\/ul>\n<h2>查詢 Wiki 後才製作簡報<\/h2>\n<p>實際查詢與採用頁面保存於 reports/wiki_queries.json。查詢包括：從哪裡開始、被包圍的位置能否下子、無兩眼是否一定死，以及面積計分是否加提子。內容缺口先在 Wiki 說明，再編排簡報。原創局部圖與終局例題明確標示為教學示意。<\/p>\n<h2>本次反思：哪個節點最常出錯<\/h2>\n<p>以本次實際發現的問題類型計，來源整合節點最多，共兩類。第一類是數目與數子兩種計分被放在同一資料集合；第二類是來源版本與貼目情境不同，S05 的 1991 年版寫 5.5，S04 提到 7.5。它們不表示其中一篇必然錯誤，問題在於若沒有分類就整合，會讓教學自相矛盾。<\/p>\n<p>本次沒有多輪失敗的頻率統計，不能據此宣稱一般模型最容易在哪裡出錯。<\/p>\n<h2>把檢查往前移到哪裡<\/h2>\n<p>把計分方法、版本與貼目參數的檢查移到來源進入 Wiki 前。每張來源卡先標明適用範圍，只有共通且一致的概念進入教學頁。用 S05 的面積定義作為本課計分基礎，數值題另標示白貼 6.5 為教學自訂設定。<\/p>\n<h2>有沒有修改 graph，為什麼<\/h2>\n<p>有。在取得資料與 ingest 之間新增來源規則檢查，並保留 Wiki 一致性檢查。這樣能在生成簡報前處理規則差異，避免完成簡報後才逐頁改計分。兩眼活棋也補上雙活的例外提示。<\/p>\n<h2>驗證與限制<\/h2>\n<p>已以獨立的棋盤運算驗證氣、提子、自殺、提子例外、簡單劫、兩眼示意、面積計分及三題答案，並檢查 Wiki 來源與內部連結。工具結果保存於 reports/validation.json。<\/p>\n<p>本環境沒有可用的瀏覽器控制工具，因此沒有宣稱完成真實點擊或手機視覺測試。已檢查 HTML 內嵌程式與導航事件；開啟後仍可由使用者確認字體與實際裝置版面。<\/p>\n<p>本教學與程式只涵蓋選定的入門概念，不是完整比賽裁判引擎。所有盤面均為自編示意，不是引用職業棋譜。<\/p>\n<h2>檔案使用<\/h2>\n<ul>\n<li>開啟 go-beginner.html，可離線閱讀簡報、Wiki、來源與流程反思。<\/li>\n<li>wiki/index.md 是 Markdown Wiki 入口。<\/li>\n<li>AGENTS.md 定義後續維護、ingest、來源與驗證規則。<\/li>\n<li>node tools/check_go.mjs 重新驗證教學盤面。<\/li>\n<li>python3 tools/build.py 依已整理的 Wiki 重建 HTML，這個重建工具不會自動搜尋或呼叫 LLM。<\/li>\n<\/ul>\n<h2>資料來源<\/h2>\n<ul>\n<li><a href=\"https://www.nihonkiin.or.jp/teach/gakkouigo/aboutigo.html\" target=\"_blank\" rel=\"noopener noreferrer\">S01 囲碁ってなあに？<\/a>，日本棋院，取得日期 2026-11-23。<\/li>\n<li><a href=\"https://www.nihonkiin.or.jp/teach/lesson/school/youso.html\" target=\"_blank\" rel=\"noopener noreferrer\">S02 囲碁の基本：囲碁ゲームの２大要素<\/a>，日本棋院，取得日期 2026-11-23。<\/li>\n<li><a href=\"https://www.nihonkiin.or.jp/teach/lesson/school/kinshi.html\" target=\"_blank\" rel=\"noopener noreferrer\">S03 囲碁の基本：石を打てない所<\/a>，日本棋院，取得日期 2026-11-23。<\/li>\n<li><a href=\"https://www.britgo.org/intro/intro2.html\" target=\"_blank\" rel=\"noopener noreferrer\">S04 How to Play<\/a>，英國圍棋協會，取得日期 2026-11-23。<\/li>\n<li><a href=\"https://www.britgo.org/rules/agashort.html\" target=\"_blank\" rel=\"noopener noreferrer\">S05 American Go Association Rules - Short Version<\/a>，AGA 制定，英國圍棋協會轉載，取得日期 2026-11-23。<\/li>\n<\/ul>", "validation": {"checked_at": "2026-11-23T10:39:00.414Z", "passed": 11, "failed": 0, "scope": "教學盤面、練習答案、簡單劫、面積計分與內部來源連結；非完整比賽規則引擎", "browser_qa": "本環境沒有可用瀏覽器控制工具，未做視覺及真實點擊測試"}}</script>

'use strict';
const DATA=JSON.parse(document.getElementById('content-data').textContent);
// Only verifies authored teaching positions. This is not a full tournament engine.
const size=9;
function empty(){return Array.from({length:size},()=>Array(size).fill(0));}
function position(black=[],white=[]){
 const b=empty();
 for(const [x,y] of black)b[y][x]=1;
 for(const [x,y] of white){if(b[y][x])throw Error('overlap');b[y][x]=2;}
 return b;
}
function adjacent(x,y){return [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([a,b])=>a>=0&&a<size&&b>=0&&b<size);}
function group(board,x,y){
 const color=board[y][x],stones=[],liberties=new Set(),seen=new Set(),todo=[[x,y]];
 if(!color)return {stones,liberties};
 while(todo.length){
  const [a,b]=todo.pop(),key=a+','+b;
  if(seen.has(key))continue;
  seen.add(key);stones.push([a,b]);
  for(const [c,d] of adjacent(a,b)){
   if(board[d][c]===0)liberties.add(c+','+d);
   else if(board[d][c]===color&&!seen.has(c+','+d))todo.push([c,d]);
  }
 }
 return {stones,liberties};
}
function move(board,color,x,y,prior=null){
 if(x<0||x>=size||y<0||y>=size||board[y][x])return {legal:false,reason:'occupied'};
 const next=board.map(r=>r.slice());next[y][x]=color;let captured=[];
 for(const [a,b] of adjacent(x,y)){
  if(next[b][a]===3-color){
   const g=group(next,a,b);
   if(!g.liberties.size){captured.push(...g.stones);for(const [c,d] of g.stones)next[d][c]=0;}
  }
 }
 if(!group(next,x,y).liberties.size)return {legal:false,reason:'suicide'};
 if(prior&&JSON.stringify(next)===JSON.stringify(prior))return {legal:false,reason:'ko'};
 return {legal:true,board:next,captured};
}
function area(board){
 let stones={1:0,2:0},territory={1:0,2:0},neutral=0;const seen=new Set();
 for(let y=0;y<size;y++)for(let x=0;x<size;x++){
  if(board[y][x]){stones[board[y][x]]++;continue;}
  if(seen.has(x+','+y))continue;
  const stack=[[x,y]],region=[],boundary=new Set();
  while(stack.length){
   const [a,b]=stack.pop(),key=a+','+b;if(seen.has(key))continue;
   seen.add(key);region.push([a,b]);
   for(const [c,d] of adjacent(a,b)){
    if(board[d][c])boundary.add(board[d][c]);else if(!seen.has(c+','+d))stack.push([c,d]);
   }
  }
  if(boundary.size===1)territory[[...boundary][0]]+=region.length;else neutral+=region.length;
 }
 return {stones,territory,neutral,black:stones[1]+territory[1],white:stones[2]+territory[2]};
}

 const nodes=[['取得五篇來源',65],['檢查正文、規則版本',165],['逐篇 ingest、更新來源卡',265],['整合 Wiki、檢查一致性',365],['查詢 Wiki、編排教學',465],['產生 HTML 簡報',565],['盤面、程式與連結檢查',665],['記錄結果與反思',765]];
 let out='<svg class="flow-svg" viewBox="0 0 650 830" role="img" aria-label="來源規則檢查、五次 ingest、Wiki 整合、簡報生成與檢查回圈"><defs><marker id="flow-end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#17674f"/></marker></defs>';
 for(let i=0;i<nodes.length;i++){
  const [name,y]=nodes[i];if(i)out+='<path d="M325 '+(y-70)+' V'+(y-31)+'" stroke="#17674f" stroke-width="2" marker-end="url(#flow-end)"/>';
  out+='<rect x="175" y="'+(y-30)+'" width="300" height="60" rx="9" fill="'+(i===1?'#d9f1e5':'#fff')+'" stroke="#17674f"/><text x="325" y="'+(y+7)+'" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#142923">'+name+'</text>';
 }
 out+='<path d="M175 165 H80 V65 H170 M175 365 H115 V265 H170 M475 665 H560 V565 H480" stroke="#17674f" stroke-width="2" fill="none" marker-end="url(#flow-end)"/><text x="10" y="110" font-size="17" fill="#52645c">重新取得</text><text x="10" y="318" font-size="17" fill="#52645c">回查、修正</text><text x="498" y="620" font-size="17" fill="#52645c">修正後重查</text><text x="487" y="271" font-size="17" fill="#52645c">重複五次</text></svg>';return out;
}
function renderProcess(){
 document.getElementById('process-content').innerHTML='<span class="eyebrow">PROJECT NOTES</span><h1>知識如何成為一份教學簡報</h1><p>先在對話確認範圍，逐篇讀取五個來源，整理為可維護的 Wiki，再查詢概念頁產生教學內容。</p><div class="summary-strip"><div><strong>5</strong><span>已 ingest 來源</span></div><div><strong>9</strong><span>概念頁</span></div><div><strong>16</strong><span>教學頁面</span></div><div><strong>3</strong><span>盤面練習</span></div></div><div class="flow-layout"><div><h2>實際採用的 graph</h2>'+flowSvg()+'</div><div><h2>實際反思</h2><h3>問題集中在哪裡？</h3><p>來源整合發現兩類差異：計分方法，以及貼目與版本設定。若直接混合，數目法與數子法會出現在同一個例題。</p><h3>把檢查往前移到哪裡？</h3><p>移到 ingest 前。先標記各篇規則版本與適用內容，再寫概念頁。S05 的舊版貼目保留在來源卡，例題另列教學設定。</p><h3>graph 有修改嗎？</h3><p>有。新增來源規則檢查，並在產生 HTML 前保留 Wiki 一致性檢查。盤面計算與內容檢查分別回到對應節點修正。</p><p class="small">本次以兩類實際問題描述單次執行，沒有把它冒充多輪錯誤率。</p><h3>驗證範圍</h3><p>棋盤、三題答案、簡單劫、數子計分與 Wiki 連結共 '+DATA.validation.passed+' 組檢查通過。HTML 程式另作語法與導航檢查。</p><p class="small">本環境沒有瀏覽器控制工具，未宣稱完成真實點擊與手機視覺測試。所有圖例均為自編，程式不是完整比賽引擎。</p></div></div><h2>來源整合的兩個決定</h2><div class="table-scroll"><table><thead><tr><th>差異</th><th>觀察</th><th>處理</th></tr></thead><tbody><tr><td>數目與數子</td><td>S01、S04 主例採數目；S05 定義兩種計分。</td><td>本課只採面積計分，不另加提子。</td></tr><tr><td>貼目與版本</td><td>S05 是 1991 版，寫 5.5；S04 提到 7.5。</td><td>例題明列白貼 6.5，作為自訂教學設定。</td></tr></tbody></table></div><h2>查詢 Wiki 的實際紀錄</h2><div class="table-scroll"><table><thead><tr><th>問題</th><th>讀取頁面</th><th>教學決定</th></tr></thead><tbody>'+DATA.queries.map(q=>'<tr><td>'+e(q.question)+'</td><td>'+q.pages.map(p=>'<a href="#wiki/'+p+'" data-route="wiki/'+p+'">'+e(DATA.pages.find(x=>x.slug===p).title)+'</a>').join('、')+'</td><td>'+e(q.decision)+'</td></tr>').join('')+'</tbody></table></div><details class="report-details"><summary>完整作業說明與反思</summary>'+DATA.report_html+'</details><p><button class="primary download-button" data-action="download">下載離線 HTML</button></p><p class="small">離線檔包含簡報、Wiki、來源及本頁，無需外部字型或程式庫。</p>';
}
function route(){
 const hash=location.hash.replace(/^#/,'');
 if(hash==='main')return;
 const parts=hash.split('/');view=['wiki','process'].includes(parts[0])?parts[0]:'lesson';
 ['lesson','wiki','process'].forEach(v=>{document.getElementById(v+'-view').hidden=v!==view;document.getElementById('tab-'+v).setAttribute('aria-pressed',String(v===view));});
 if(view==='lesson'){current=Math.max(0,Math.min(SLIDES.length-1,Number.parseInt(parts[1],10)||0));renderLesson();}
 else if(view==='wiki'){renderWiki(parts[1]||'index');document.getElementById('progress-bar').style.width='0';}
 else{renderProcess();document.getElementById('progress-bar').style.width='0';}
}
function go(path){if(location.hash==='#'+path){route();}else{location.hash=path;}window.scrollTo(0,0);}
document.getElementById('slidejump').innerHTML=SLIDES.map((s,i)=>'<option value="'+i+'">'+String(i+1).padStart(2,'0')+'　'+e(s.title)+'</option>').join('');
document.getElementById('slidejump').addEventListener('change',ev=>go('lesson/'+ev.target.value));
document.getElementById('wiki-search').addEventListener('input',filterWiki);
document.getElementById('previous').addEventListener('click',()=>{if(current>0)go('lesson/'+(current-1));});
document.getElementById('next').addEventListener('click',()=>{if(current<SLIDES.length-1)go('lesson/'+(current+1));});
document.addEventListener('click',ev=>{
 const nav=ev.target.closest('[data-route]');if(nav){ev.preventDefault();go(nav.dataset.route);return;}
 const answer=ev.target.closest('[data-answer]');if(answer){const [q,a]=answer.dataset.answer.split(':').map(Number);answers[q]=a;renderLesson();return;}
 const b=ev.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action;
 if(a==='liberty')libShown=!libShown;
 if(a==='capture')captured=!captured;
 if(a==='legal')legalExample=!legalExample;
 if(a==='ko')koAfter=!koAfter;
 if(a==='score')scoreShown=!scoreShown;
 if(a==='open-wiki'){go('wiki/index');return;}
 if(a==='open-process'){go('process');return;}
 if(a==='download'){
  const blob=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='go-beginner.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);return;
 }
 renderLesson();
});
document.addEventListener('keydown',ev=>{
 if(view!=='lesson'||['INPUT','TEXTAREA','SELECT'].includes(ev.target.tagName)||ev.target.isContentEditable||ev.altKey||ev.ctrlKey||ev.metaKey)return;
 if(ev.key==='ArrowRight'&&current<SLIDES.length-1){ev.preventDefault();go('lesson/'+(current+1));}
 if(ev.key==='ArrowLeft'&&current>0){ev.preventDefault();go('lesson/'+(current-1));}
});
window.addEventListener('hashchange',route);route();
</script>
